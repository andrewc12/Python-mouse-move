<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape" width="6810" height="1960" viewBox="0 0 6810 1960">
<title>Status pill layout (1 unit inside "pill-px" = 1 real screen pixel)</title>
<rect width="6810" height="1960" fill="#202124"/>
<text x="400" y="170" font-size="90" font-weight="bold" fill="#fff" font-family="Segoe UI, sans-serif">Status pill - layout guide</text>
<text x="400" y="260" font-size="55" fill="#aaa" font-family="Segoe UI, sans-serif">Everything inside the group "pill-px" is scaled x10: 1 unit = 1 real pixel, so nudging by 1 moves a piece by exactly 1 px. Each piece is its own group: move the group and its guide lines go with it.</text>
<text x="400" y="335" font-size="55" fill="#aaa" font-family="Segoe UI, sans-serif">Layers: "reference-screenshot" (your capture, hidden - turn on to trace), "pixel-grid", "pill", "guides". Edit, save the SVG, and send it back.</text>
<g id="pill-px" transform="translate(400,520) scale(10)">
 <g id="reference-screenshot" inkscape:groupmode="layer" inkscape:label="reference-screenshot (hidden)" style="display:none"><image x="0" y="0" width="601" height="37" preserveAspectRatio="none" style="image-rendering:pixelated" xlink:href="data:image/png;base64,"/></g>
 <g id="pill" inkscape:groupmode="layer" inkscape:label="pill">
  <rect id="pill-bg" x="0" y="0" width="601" height="37" fill="#3f9e5a"/>
  <g id="el-label" inkscape:label="label (text + its guides)">
<text id="label-text" textLength="54.5" lengthAdjust="spacingAndGlyphs" x="10.3" y="23" font-family="Segoe UI, sans-serif" font-size="13.33" font-weight="bold" fill="#fff" xml:space="preserve">Listening</text>
<line id="label-head-top" x1="5.300000000000001" y1="13" x2="69.8" y2="13" stroke="#ff4fd8" stroke-width="0.09"/>
<line id="label-cap-top" x1="5.300000000000001" y1="14" x2="69.8" y2="14" stroke="#ffd400" stroke-width="0.09"/>
<line id="label-x-height-top" x1="5.300000000000001" y1="16" x2="69.8" y2="16" stroke="#00e5ff" stroke-width="0.09"/>
<line id="label-baseline" x1="5.300000000000001" y1="23" x2="69.8" y2="23" stroke="#ffffff" stroke-width="0.12"/>
<line id="label-tail-bottom" x1="5.300000000000001" y1="26" x2="69.8" y2="26" stroke="#ff8a00" stroke-width="0.09"/>
</g>
  <g id="el-heard" inkscape:label="heard (text + its guides)">
<text id="heard-text" textLength="392" lengthAdjust="spacing" x="77.5" y="22" font-family="Consolas, monospace" font-size="12" font-weight="normal" fill="#fff" xml:space="preserve">✗ w w k sierra bar bar greater than tab space bar up i b</text>
<line id="heard-head-top" x1="72.5" y1="13" x2="474.5" y2="13" stroke="#ff4fd8" stroke-width="0.09" stroke-dasharray="0.5 0.3"/>
<line id="heard-x-height-top" x1="72.5" y1="16" x2="474.5" y2="16" stroke="#00e5ff" stroke-width="0.09" stroke-dasharray="0.5 0.3"/>
<line id="heard-baseline" x1="72.5" y1="22" x2="474.5" y2="22" stroke="#ffffff" stroke-width="0.12" stroke-dasharray="0.5 0.3"/>
<line id="heard-tail-bottom" x1="72.5" y1="24" x2="474.5" y2="24" stroke="#ff8a00" stroke-width="0.09" stroke-dasharray="0.5 0.3"/>
</g>
  <g id="el-meter" inkscape:label="meter (track + bar + its guides)">
<rect id="meter-track" x="480" y="14" width="89" height="10" fill="#3c3c3c"/>
<rect id="meter-bar" x="480" y="14" width="32" height="10" fill="#51ce71"/>
<line id="meter-top" x1="474" y1="14" x2="575" y2="14" stroke="#b388ff" stroke-width="0.09"/><line id="meter-centre" x1="474" y1="19" x2="575" y2="19" stroke="#b388ff" stroke-width="0.09" stroke-dasharray="0.6 0.4"/><line id="meter-bottom" x1="474" y1="24" x2="575" y2="24" stroke="#b388ff" stroke-width="0.09"/>
</g>
  <g id="el-arrow" inkscape:label="arrow button (glyph + its guides)">
<g id="arrow-glyph" fill="none" stroke="#fff" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round">
<path d="M580.5 17.2 H589.5 M587.3 15.3 L589.5 17.2 L587.3 19.1"/><path d="M589.5 21.8 H580.5 M582.7 19.9 L580.5 21.8 L582.7 23.7"/></g>
<line id="arrow-top" x1="575" y1="15" x2="596" y2="15" stroke="#b388ff" stroke-width="0.09"/><line id="arrow-centre" x1="575" y1="19.5" x2="596" y2="19.5" stroke="#b388ff" stroke-width="0.09" stroke-dasharray="0.6 0.4"/><line id="arrow-bottom" x1="575" y1="24" x2="596" y2="24" stroke="#b388ff" stroke-width="0.09"/>
</g>
 </g>
 <g id="pixel-grid" inkscape:groupmode="layer" inkscape:label="pixel-grid" opacity="0.18">
  <defs><pattern id="px" width="1" height="1" patternUnits="userSpaceOnUse"><path d="M1 0H0V1" fill="none" stroke="#fff" stroke-width="0.03"/></pattern></defs>
  <rect x="0" y="0" width="601" height="37" fill="url(#px)"/></g>
 <g id="guides" inkscape:groupmode="layer" inkscape:label="guides (pill edges + centre)"><line id="pill-top" x1="-8" y1="0" x2="609" y2="0" stroke="#ffffff" stroke-width="0.06"/><line id="pill-centre" x1="-8" y1="18.5" x2="609" y2="18.5" stroke="#ffffff" stroke-width="0.06" stroke-dasharray="1 0.6"/><line id="pill-bottom" x1="-8" y1="37" x2="609" y2="37" stroke="#ffffff" stroke-width="0.06"/></g>
</g>
<g id="legend" inkscape:groupmode="layer" inkscape:label="legend">
<text x="400" y="960" font-size="62" font-weight="bold" fill="#fff" font-family="Segoe UI, sans-serif">Key (heard text uses dashed lines, label text solid)</text>
<line x1="400" y1="1076" x2="600" y2="1076" stroke="#ff4fd8" stroke-width="7"/><text x="640" y="1090" font-size="60" fill="#e8e8e8" font-family="Segoe UI, sans-serif">Head / ascender top (b d k l t, i-dot)</text>
<line x1="400" y1="1171" x2="600" y2="1171" stroke="#ffd400" stroke-width="7"/><text x="640" y="1185" font-size="60" fill="#e8e8e8" font-family="Segoe UI, sans-serif">Cap-height top (L, S)</text>
<line x1="400" y1="1266" x2="600" y2="1266" stroke="#00e5ff" stroke-width="7"/><text x="640" y="1280" font-size="60" fill="#e8e8e8" font-family="Segoe UI, sans-serif">x-height top (a c e o)</text>
<line x1="400" y1="1361" x2="600" y2="1361" stroke="#ffffff" stroke-width="7"/><text x="640" y="1375" font-size="60" fill="#e8e8e8" font-family="Segoe UI, sans-serif">Baseline (bottom of letters)</text>
<line x1="400" y1="1456" x2="600" y2="1456" stroke="#ff8a00" stroke-width="7"/><text x="640" y="1470" font-size="60" fill="#e8e8e8" font-family="Segoe UI, sans-serif">Tail / descender bottom (g p y)</text>
<line x1="400" y1="1551" x2="600" y2="1551" stroke="#b388ff" stroke-width="7"/><text x="640" y="1565" font-size="60" fill="#e8e8e8" font-family="Segoe UI, sans-serif">Meter / arrow top, centre, bottom</text>
<line x1="400" y1="1646" x2="600" y2="1646" stroke="#ffffff" stroke-width="7"/><text x="640" y="1660" font-size="60" fill="#e8e8e8" font-family="Segoe UI, sans-serif">Pill top / centre (dashed) / bottom</text>
</g>
</svg>